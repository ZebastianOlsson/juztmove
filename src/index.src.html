<style>
/* Layout idea: mobilapp med fast flikrad i botten; kort i en kolumn, max 640px bred. Kondenserad rubrikstil som i passbilderna. */
:root{

  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){

    --accent:#3CC593; --accent-ink:#06261B; --accent-soft:#183A2E;
    --run:#F08A4B; --run-soft:#3A2418; --mob:#A99BF2; --mob-soft:#2A2547;
    --good:#4ADE80; --warn:#F59E0B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18211E; --ink:#E8EEEA; --muted:#9AA8A2; --line:#2A3631;
  --accent:#3CC593; --accent-ink:#06261B; --accent-soft:#183A2E;

}
*{box-sizing:border-box}
html,body{height:100%;margin:0;width:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h1{font-size:30px;text-transform:uppercase;line-height:1.05}
h2{font-size:22px;text-transform:uppercase}

.app{width:100%;max-width:640px;margin:0 auto;overflow-x:hidden;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}

.stack{display:flex;flex-direction:column;gap:12px}

.card.hero.mob{border-left-color:var(--mob)}
.card.hero.move{border-left-color:var(--ink)}
.mdots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.mdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.mdot.on{background:var(--accent);border-color:var(--accent)}

.movebox{background:var(--bg);border-radius:12px;padding:12px}
.nudge{background:var(--run-soft);border-radius:10px;padding:8px 10px;font-weight:500}
.chips.wrap{flex-wrap:wrap}
.setsec{padding:0;border-left:4px solid var(--line)}.setsec.sec-s{border-left-color:var(--c-s)}.setsec.sec-r{border-left-color:var(--c-r)}.setsec.sec-m{border-left-color:var(--c-m)}.setsec.sec-v{border-left-color:var(--ink)}
.setsec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;color:var(--ink)}.setsec>summary .grow{flex:1;min-width:0}.setsec .sectitle{color:var(--ink)}.setsec>summary::-webkit-details-marker{display:none}
.setsec>summary::after{content:'▾';color:var(--muted);font-size:18px}.setsec[open]>summary::after{content:'▴'}
.sectitle{font-family:var(--display);font-size:18px;letter-spacing:.02em}
.secbody{padding:0 16px 16px;gap:16px}
.setfield{display:flex;flex-direction:column;gap:6px}.setfield .lab,.setfield>.lab{font-size:14px;font-weight:600}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.setrow>span{display:flex;flex-direction:column;gap:2px}.setrow .d{font-weight:400}
.stepper{display:flex;align-items:center;gap:8px;flex:none}.stepper strong{min-width:52px;text-align:center}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{left:21px}.sw:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.week.mini{gap:4px}.week.mini .day{min-height:0;padding:6px 2px;cursor:default}.week.mini .dn{font-size:12px}.week.mini .tag{font-size:10px}
.peek .li{padding:8px 0}.noanim.sm{width:44px;height:41px}
.exacts{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg-b{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:9px;padding:9px 4px;background:none;color:var(--muted);cursor:pointer}
.seg-b[aria-selected="true"]{background:var(--ink);color:var(--bg)}
details.wk{border-top:1px solid var(--line);padding-top:6px}details.wk>summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;padding:6px 0}
details.wk>summary::-webkit-details-marker{display:none}details.wk>summary::after{content:'▾';color:var(--muted);margin-left:8px}details.wk[open]>summary::after{content:'▴'}
details.wk>summary strong{flex:1}details.wk .list .li:first-child{border-top:0}
.prow{align-items:center}.prow.done strong{color:var(--muted);font-weight:600}.prow.next{background:var(--accent-soft);border-radius:10px;padding-left:8px;padding-right:8px;border-top-color:transparent}
.pdot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--accent)}
.pdot.done{border-color:var(--accent);background:var(--accent-soft)}.pdot.next{border-color:var(--accent);background:var(--accent)}
.chev{color:var(--muted);font-size:20px;line-height:1}
.rot{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}.rot li{padding:2px 0}.rot li span:first-child{margin-right:8px}.rot li.on{font-weight:700}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}.facts dt{color:var(--muted);font-size:14px}.facts dd{margin:0;font-size:14px}
.flab{margin-bottom:4px}.selsm{width:auto;max-width:60%;font-size:16px;padding:6px 8px}
h1.h1sm{font-size:24px;line-height:1.1}
.exrow{align-items:center}.noanim{flex:none;width:56px;height:52px;border-radius:10px;background:var(--line);opacity:.4}
.checkin{border-left:4px solid var(--mob)}.linkbtn{background:none;border:0;padding:0;text-align:left;text-decoration:underline;cursor:pointer;font:inherit}
.ci-opt{justify-content:flex-start;text-align:left;width:100%}.ci-opt[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}
.ci-part{flex-wrap:wrap;gap:6px}
:root{--c-s:#0E7A5A;--c-r:#C2410C;--c-m:#5B4BB7;--h0:#E9ECE6;--h1:#C4E3D5;--h2:#86C7AB;--h3:#3E9A75;--h4:#0E6B4F}
:root[data-theme="dark"]{--c-s:#2AA87B;--c-r:#DA7235;--c-m:#8E7EE2;--h0:#222C28;--h1:#1F4637;--h2:#26694F;--h3:#2E9A72;--h4:#5FD3A6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-s:#2AA87B;--c-r:#DA7235;--c-m:#8E7EE2;--h0:#222C28;--h1:#1F4637;--h2:#26694F;--h3:#2E9A72;--h4:#5FD3A6}}
h4{margin:6px 0 0;font-size:14px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px}
.tiles .k{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05}
.prog-hero{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.ins{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cmp .k2{font-family:var(--display);font-size:22px;font-weight:700}
.dl{font-size:12px;color:var(--muted);font-weight:600}.dl.up{color:var(--accent)}.dl.down{color:var(--run)}
.legend{display:flex;gap:12px;flex-wrap:wrap}.legend i,.hmleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.hbars{display:flex;flex-direction:column;gap:6px}.hb{display:grid;grid-template-columns:56px 1fr 52px;align-items:center;gap:8px;font-size:13px}

.tipon{color:var(--ink)!important;font-weight:600}

details.card>summary{cursor:pointer;list-style:none}

.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.daynav .dn2{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.daynav .btn:disabled{opacity:.35}
.donebox{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-weight:600}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpeb{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.rpeb[aria-pressed="true"]{background:var(--run);border-color:var(--run);color:#fff}
.prealert{background:var(--run);color:#fff;border-radius:10px;padding:10px;font-weight:600;font-size:18px}
.nextbox{font-size:15px;color:var(--muted)}.nextbox strong{color:var(--ink)}
input[type=email]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;font-size:16px}
.backupcard{border-left:5px solid var(--warn)}
.restore{align-self:flex-start;border-color:var(--accent);color:var(--accent);font-weight:600}
.sugg{margin-top:6px;font-size:14px;font-weight:500;padding:6px 10px;border-radius:8px;background:var(--bg)}
.sugg.up{background:var(--accent-soft)}
.sugg.down{background:var(--run-soft)}
.rtable{display:flex;flex-direction:column;margin-top:8px;border-top:1px solid var(--line)}
.rtable .rh,.rtable .rr{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:start}
.rtable .rh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rtable .rr span:last-child{text-align:right}
.rtable .t-h{background:var(--run-soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
.setspeed{font-size:22px}.setspeed strong{font-family:var(--display);font-size:36px}
.day.chg{border-style:dashed}
.day:disabled{opacity:.75;cursor:default}
.waitnote{background:var(--run-soft);color:var(--ink)}
details.plan summary{font-weight:600;color:var(--ink)}
.anim{flex:none;background:var(--bg);border-radius:10px}
.movebox .anim{background:var(--surface)}
.animcol{display:flex;flex-direction:column;gap:4px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
details.why{margin-top:8px}details.why p{margin:6px 0;font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.ob h1{font-size:28px}
button.day{font:inherit;color:inherit;cursor:pointer}
.day{min-width:0;padding-left:2px;padding-right:2px}.day .tag{overflow-wrap:anywhere;font-size:10.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.run{background:var(--run-soft)} .pill.mob{background:var(--mob-soft)} .pill.line{background:transparent;border:1px solid var(--line)}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.run{background:var(--run);color:#fff} .btn.mob{background:var(--mob);color:#fff}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}

input[type=number],input[type=text],input[type=search],select,textarea{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}

</head>

function weekTemplate(ss,cc,fresh){
  if(!fresh&&Array.isArray(S.settings.weekPlan)&&S.settings.weekPlan.length===7)return S.settings.weekPlan;
  const s=Math.max(0,Math.min(6,(ss??S.settings.strength)|0)), c=Math.max(0,Math.min(7-s,(cc??S.settings.cardio)|0));
  const pat={0:[],1:[0],2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5]}[s];
  const t=Array(7).fill('m'); pat.forEach(i=>t[i]='s');
  const order=[5,1,3,6,2,4,0]; let left=c;
  for(const i of order){if(!left)break;if(t[i]==='m'&&!(t[i-1]==='r')&&!(t[i+1]==='r')){t[i]='r';left--}}
  for(const i of order){if(!left)break;if(t[i]==='m'){t[i]='r';left--}}
  return t; // s=styrka r=löpning m=rörlighet/vila
}
let swap=null;

function seqInit(){const st=S.settings;if(!st.seq||typeof st.seq.pos!=='number'){
  st.seq={pos:(new Date().getDay()+6)%7,res:null,doneType:null};markDirty('settings');
  const L=S.log.filter(l=>l.date===today()),typ=L.some(l=>l.type==='styrka')?'s':L.some(l=>l.type==='löpning')?'r':L.some(l=>l.type==='rörlighet')?'m':null;
  if(typ){const t=today();st.seq.pos+=1;st.seq.res=t;st.seq.doneType=typ;if(S.days[t])S.days[t].did=typ}}
  return st.seq}
function seqType(off){return weekTemplate()[((seqInit().pos+off)%7+7)%7]}
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function plannedFor(date,ignoreOverride){
  const k=dkey(date), t=today(); if(swap&&k===t)return swap;
  const o=!ignoreOverride&&S.days[k]&&S.days[k].plan; if(o)return o;
  const q=seqInit(), diff=daysBetween(t,k);
  if(diff<0) return (S.days[k]&&S.days[k].did)||null;
  if(diff===0) return q.res===t?(q.doneType||seqType(-1)):seqType(0);
  const postponed=S.days[t]&&S.days[t].plan==='v'&&q.res!==t;
  return seqType(q.res===t||postponed?diff-1:diff);
}
function resolveDay(how){
  const q=seqInit(), t=today(); if(q.res===t) return false;
  const typ=(S.days[t]&&S.days[t].plan&&S.days[t].plan!=='v')?S.days[t].plan:seqType(0);
  q.pos+=1; q.res=t; q.doneType=typ; day().did=how==='skip'?'skip':typ;

}
function waitingInfo(){const q=seqInit(), t=today();if(!q.res||q.res===t)return null;const d=daysBetween(q.res,t);return d>=2?{since:addDays(new Date(q.res+'T12:00:00'),1),days:d-1}:null}

function rankRuns(afterToday){

    const cat=(n===0)===(S.settings.runStyle!=='lugnt')?1:2;const list=RUNS_5K.filter(r=>r.cat===cat);const last=[...S.log].reverse().find(l=>l.type==='löpning'&&list.some(r=>r.id===l.rid));
    const i=last?(list.findIndex(r=>r.id===last.rid)+1)%list.length:0;const f=list.slice(i).concat(list.slice(0,i));return f.concat(RUNS_5K.filter(r=>!f.includes(r)))}
  if(where==='ute') return RUNS.filter(r=>r.where==='ute');
  const mon=monday(new Date());
  const thisWeek=S.log.filter(l=>l.type==='löpning'&&new Date(l.date)>=mon&&(afterToday||l.date!==today())).length;
  const fartlekDone=S.log.some(l=>l.rid==='r-fartlek'&&new Date(l.date)>=mon);
  const rot=cat=>{const list=RUNS.filter(r=>r.where==='band'&&r.cat===cat);const last=[...S.log].reverse().find(l=>l.type==='löpning'&&list.some(r=>r.id===l.rid));
    const i=last?(list.findIndex(r=>r.id===last.rid)+1)%list.length:0;return list.slice(i).concat(list.slice(0,i))};
  let first;

  } else {

  const st=S.settings, target=rpeTarget(r); let V=v10Base(); const before=V; let msg='';
  if(actualHard&&actualHard.length&&!RUN_EASY.includes(r.id)&&r.track!=='nyb'&&Math.abs(rpe-target)<=1){
    const implied=actualHard.reduce((s,x)=>s+x.kmh/x.f,0)/actualHard.length/(comebackOn()?0.95:1);
    V=0.5*V+0.5*implied;
  }
  const diff=rpe-target, since=st.runLastInc?(Date.now()-st.runLastInc)/864e5:99;
  if(diff>=2){V-=0.5;msg=`Det var ${rpe}/10 mot målet ${target}. Sänker farten 0,5 km/h nästa gång.`}
  else if(diff>=1){msg=`${rpe}/10 – lite över målet ${target}. Samma fart nästa gång.`}
  else if(diff<=-1){ if(since>=14){V+=diff<=-2?0.5:0.25;st.runLastInc=Date.now();msg=`${rpe}/10 – under målet ${target}. Höjer farten ${diff<=-2?'0,5':'0,25'} km/h.`}
    else msg=`${rpe}/10 – under målet. Farten höjs högst varannan vecka, nästa höjning om ${Math.ceil(14-since)} dagar.`}
  else msg=`${rpe}/10 – precis på målet. Samma fart nästa gång.`;
  st.v10=Math.round(V*100)/100; markDirty('settings');
  const ch=Math.round((V-before)*10)/10; if(Math.abs(ch)>=0.1&&!/Sänker|Höjer/.test(msg))msg+=` Din löpfart justeras ${ch>0?'+':''}${fmtK(ch)} km/h efter farten du faktiskt sprang.`;

/* ---------- Så gör du: korta textbeskrivningar som komplement till animationerna ---------- */
const HOWTO={
 /* Rörlighet */
 'Katt–ko':'Stå på alla fyra med händerna under axlarna och knäna under höfterna. Andas in och svanka, med blicken framåt (ko). Andas ut och runda hela ryggen uppåt, med hakan mot bröstet (katt).',
 "World's greatest stretch":'Ta ett långt utfallssteg och sätt båda händerna i golvet på insidan av den främre foten. Sänk armbågen mot golvet, vrid sedan upp samma arm mot taket och följ handen med blicken. Byt sida.',
 'Höftrotation 90/90':'Sitt på golvet med båda benen böjda i 90 grader, det ena framför dig och det andra åt sidan bakom dig. Sitt rak och luta dig lätt fram över det främre benet. Fäll sedan båda knäna över till andra sidan utan att använda händerna.',
 'Bröstryggsrotation på knä':'Stå på alla fyra och lägg ena handen bakom huvudet. För armbågen ner mot den motsatta handen och vrid den sedan upp mot taket så långt det går. Höften står still, det är bröstryggen som roterar.',
 'Djup knäböj, håll':'Sätt fötterna lite bredare än höfterna och sjunk ner så djupt du kan med hälarna i golvet. Tryck isär knäna med armbågarna och håll bröstet uppe. Håll i något om balansen sviktar.',
 'Framåtfällning, mjuka knän':'Stå med fötterna höftbrett och fäll överkroppen framåt från höften. Böj knäna lätt och låt huvud och armar hänga tungt. Rulla upp långsamt, kota för kota.',
 'Axelcirklar med pinne':'Håll en pinne, ett band eller en handduk med brett grepp framför dig. För den med raka armar över huvudet och bak mot rumpan, och sedan tillbaka. Gör greppet bredare om det tar stopp.',
 'Höftböjarstretch i utfall':'Sätt ena knät i golvet och den andra foten fram. Spänn rumpan på knäsidan och skjut höften framåt tills det sträcker framtill i höften. Undvik att svanka.',
 'Bröstöppnare i dörrkarm':'Sätt underarmen mot dörrkarmen med armbågen i axelhöjd. Ta ett litet steg fram och vrid bröstet bort från armen tills det sträcker i bröstet. Byt arm.',
 'Nackrullning':'Sänk hakan mot bröstet och rulla huvudet långsamt i en halvcirkel från axel till axel. Håll axlarna låga och gör rörelsen mjukt, utan att rycka.',
 'Barnets position':'Sitt på hälarna med knäna isär och fäll överkroppen framåt mot golvet. Sträck armarna långt fram, vila pannan mot golvet och andas ner i ryggen.',
 'Hamstring på rygg med band':'Ligg på rygg och lägg ett band eller en handduk runt ena foten. Dra upp det raka benet mot taket tills det sträcker i baksida lår. Det andra benet ligger kvar i golvet.',
 'Solhälsning A':'Sträck armarna upp och fäll framåt mot golvet. Kliv eller hoppa bak till planka och sänk dig mot golvet. Lyft bröstet till kobra och tryck sedan bakåt till nedåtgående hund. Kliv fram och res dig upp med armarna mot taket.',
 'Krigaren II':'Stå bredbent med den främre foten rakt fram och den bakre lite inåt. Böj det främre knät rakt över foten och sträck armarna ut åt sidorna i axelhöjd. Titta ut över den främre handen.',
 'Triangeln':'Stå bredbent med båda benen raka och den främre foten rakt fram. Luta överkroppen åt sidan över det främre benet. Lägg den nedre handen på smalbenet och sträck den övre handen mot taket.',
 'Duvan':'Lägg ena smalbenet på tvären framför dig och sträck det andra benet rakt bakåt. Sitt rak, eller fäll framåt över det främre benet för mer sträck. Känner du det i knät, dra in foten närmare höften.',
 'Bron':'Ligg på rygg med böjda knän och fötterna i golvet. Tryck ifrån med hälarna och lyft höften tills kroppen är rak från knän till axlar. Håll kvar och spänn rumpan.',
 'Liggande vridning':'Ligg på rygg och dra upp ena knät. Fäll knät över kroppen mot golvet på motsatt sida och sträck ut armen åt andra hållet. Försök hålla båda axlarna kvar i golvet.',
 'Avslappning':'Ligg på rygg med armar och ben avslappnade. Blunda och andas lugnt. Släpp spänningar i käke, axlar och händer.',
 'Kosackböj':'Stå mycket bredbent med tårna lätt utåt. Sätt dig ner åt ena sidan på det böjda benet och låt det andra benet vara rakt, med tårna mot taket. Hälen på det böjda benet stannar i golvet. Res dig och gör samma sak åt andra hållet.',
 'Grodan':'Stå på alla fyra och för isär knäna så långt det går, med smalbenen parallellt och fötterna utåt. Sänk ner på underarmarna och gunga höften lugnt bakåt mot hälarna.',
 'Vadstretch mot vägg':'Sätt händerna mot en vägg och ta ett långt steg bakåt med ena benet. Håll det bakre benet rakt och hälen i golvet, och luta dig mot väggen tills det sträcker i vaden.',
 'Couch stretch':'Sätt ena knät nära en vägg eller soffa med smalbenet uppåt längs den. Ställ den andra foten framför dig. Res upp överkroppen och spänn rumpan tills det sträcker framtill i låret och höften. Lägg något mjukt under knät.',
 'Fotledscirklar':'Lyft ena foten från golvet och rita stora, långsamma cirklar med tårna åt båda hållen. Håll i något för balansen och byt fot.',
 'Vadstretch, rakt knä':'Ställ dig med händerna mot en vägg och ena benet rakt bakåt. Hälen ska vara i golvet. Luta dig fram tills det sträcker högt upp i vaden.',
 'Vadstretch, böjt knä':'Som vanlig vadstretch, men böj det bakre knät och låt hälen stanna i golvet. Då sträcker det längre ner i vaden och vid hälsenan.',
 'Framsida lår stående':'Stå på ett ben och håll dig i något. Ta tag om foten och dra hälen mot rumpan. Håll knäna ihop och skjut höften lätt framåt.',
 'Hamstring på trappsteg':'Sätt hälen på ett trappsteg med benet rakt och tårna upp. Fäll överkroppen fram från höften med rak rygg tills det sträcker i baksida lår.',
 'Höftböjare i utfall':'Sätt ena knät i golvet och den andra foten fram. Spänn rumpan på knäsidan och skjut höften framåt tills det sträcker framtill i höften. Undvik att svanka.',
 'Bakåtgång':'Gå baklänges med korta steg. Landa på framfoten och tryck ifrån så att knät sträcks. På löpband: låg fart, lite lutning, och håll i dig.',
 'Tibialislyft mot vägg':'Luta ryggen mot en vägg med fötterna en bit fram. Lyft tårna mot smalbenen så högt du kan och sänk långsamt. Ju längre fram du står, desto tyngre blir det.',
 'Patrick step':'Stå på ett lågt steg på ett ben, med det andra benet rakt och hälen fram. Böj det stående knät framåt över tårna och sänk tills hälen nuddar golvet framför steget. Res dig och upprepa.',
 'Split squat med knät över tårna':'Stå i ett kort utfall med den bakre foten på tå. Sänk dig rakt ner och låt det främre knät gå fram över tårna, så långt det känns bra. Håll i något för balansen.',
 'Tåhävning med raka ben på trappsteg':'Stå med framfötterna på ett trappsteg och hälarna utanför. Sänk hälarna så långt ner det går och res dig sedan upp på tå så högt du kan. Gör det långsamt med raka knän.',
 'Elephant walk':'Fäll framåt och sätt händerna i golvet, eller på ett steg. Böj och sträck knäna växelvis, så att ett knä i taget sträcks och du känner det i baksida lår.',
 'Bäckenbottenknip, långa':'Knip som om du ville hålla emot både kiss och gas, och lyft lätt inåt-uppåt. Håll knipet 5–10 sekunder med normal andning och slappna sedan av lika länge.',
 'Bäckenbottenknip, snabba':'Knip snabbt och kraftigt, och släpp helt direkt efter. Gör 10 i rad och vila lite mellan omgångarna.',
 'Dead bug':'Ligg på rygg med armarna mot taket och knäna i 90 grader. Tryck ländryggen mot golvet. Sträck ut motsatt arm och ben långsamt mot golvet och dra tillbaka. Byt sida.',
 'Höftlyft på golvet':'Ligg på rygg med böjda knän och fötterna i golvet. Tryck ifrån med hälarna och lyft höften tills kroppen är rak från knän till axlar. Kläm ihop rumpan högst upp och sänk långsamt.',
 'Bird dog':'Stå på alla fyra och spänn magen. Sträck ut motsatt arm och ben tills de är i linje med ryggen. Håll höften stilla, dra tillbaka och byt sida.',
 'Sidoplanka på knä':'Ligg på sidan med underarmen under axeln och knäna böjda. Lyft höften så att kroppen blir rak från knä till huvud och håll kvar.',
 'Djupandning i ryggläge':'Ligg på rygg med böjda knän och en hand på magen. Andas in lugnt genom näsan så att magen och nedre revbenen vidgas. Andas ut långsamt och lite längre än inandningen.',
 /* Ben */
 'Knäböj med skivstång':'Lägg stången på övre delen av ryggen och stå axelbrett med tårna lätt utåt. Böj höft och knän samtidigt och sätt dig ner tills låren är minst parallella med golvet. Tryck upp genom hela foten med bröstet uppe.',
 'Frontböj':'Vila stången på framsidan av axlarna med armbågarna högt. Sätt dig rakt ner med upprätt överkropp och tryck dig upp igen.',
 'Gobletknäböj':'Håll en hantel eller kettlebell lodrätt mot bröstet. Sätt dig djupt ner mellan knäna med armbågarna innanför knäna och tryck upp med bröstet uppe.',
 'Knäböj, kroppsvikt':'Stå höftbrett. Sitt ner bakåt som mot en stol, så djupt det känns bra, och res dig igen. Hälarna stannar i golvet och knäna får gå fram över tårna.',
 'Benpress':'Sätt fötterna höftbrett mitt på plattan. Sänk tills knäna är ungefär i 90 grader och tryck sedan ifrån utan att låsa knäna helt. Ryggen ska ligga kvar mot dynan.',
 'Hack squat':'Stå med ryggen mot dynan och fötterna höftbrett på plattan. Sänk dig kontrollerat djupt och tryck upp genom hela foten.',
 'Knäböj i smithmaskin':'Lägg stången på övre delen av ryggen och ställ fötterna lite framför kroppen. Sänk dig tills låren är parallella med golvet och tryck upp.',
 'Pistol squat mot bänk':'Stå på ett ben framför en bänk med det andra benet sträckt framåt. Sätt dig långsamt ner på bänken och res dig på samma ben.',
 'Upphopp':'Gör en snabb kvarts knäböj och hoppa rakt upp med armarna. Landa mjukt på framfoten med böjda knän och gå direkt in i nästa hopp.',
 'Benspark':'Sitt i maskinen med dynan framför vristerna. Sträck benen helt och sänk långsamt tillbaka.',
 'Väggsittning':'Luta ryggen mot en vägg och glid ner tills knäna är ungefär i 90 grader. Håll kvar med vikten på hälarna.',
 'Bulgarisk utfallsböj':'Lägg ovansidan av den bakre foten på en bänk och ställ den främre foten en bit fram. Sänk dig rakt ner tills det bakre knät nästan nuddar golvet och tryck upp genom det främre benet.',
 'Gående utfall':'Ta ett långt steg framåt och sänk det bakre knät mot golvet. Tryck ifrån och kliv direkt fram i nästa steg med andra benet.',
 'Bakåtutfall':'Kliv bakåt med ena benet och sänk det bakre knät mot golvet. Tryck tillbaka till start med det främre benet och byt sida.',
 'Step-up på bänk':'Sätt hela ena foten på en bänk eller låda. Kliv upp genom att trycka ifrån med det benet, inte med det som står på golvet, och sänk kontrollerat ner.',
 'Marklyft':'Stå med stången över mitten av foten och greppa precis utanför benen. Platt rygg och bröstet upp. Tryck ifrån golvet och res dig med stången nära kroppen. Sänk den på samma sätt.',
 'Rumänska marklyft':'Håll stången framför låren med mjuka knän. Skjut höften bakåt och låt stången glida längs benen tills det sträcker i baksida lår. Res dig genom att skjuta fram höften. Ryggen ska vara platt hela tiden.',
 'Rumänska marklyft med hantlar':'Håll hantlarna framför låren med mjuka knän. Skjut höften bakåt och låt hantlarna glida längs benen tills det sträcker i baksida lår. Res dig genom att skjuta fram höften.',
 'Enbens rumänska marklyft':'Stå på ett ben med mjukt knä. Fäll framåt från höften och sträck det fria benet bakåt i linje med kroppen. Res dig igen och håll höften rak mot golvet.',
 'Good morning':'Lägg stången på ryggen och ha mjuka knän. Fäll överkroppen framåt med rak rygg tills det sträcker i baksida lår och res dig igen.',
 'Kettlebellsving med hantel':'Stå brett och håll hanteln med båda händerna. Fäll från höften och svinga hanteln bak mellan benen. Skjut fram höften explosivt så att hanteln flyger upp till brösthöjd. Det är höften som gör jobbet, inte armarna.',
 'Liggande lårcurl':'Ligg på mage med dynan bakom vristerna. Böj knäna och dra hälarna mot rumpan, och sänk långsamt. Höften ska ligga kvar mot dynan.',
 'Sittande lårcurl':'Sitt med dynan bakom vristerna och lårdynan nere. Dra hälarna ner och bakåt så långt det går och släpp långsamt tillbaka.',
 'Nordic hamstring curl':'Stå på knä med fötterna fastlåsta. Fäll långsamt framåt med rak kropp så långt du klarar och ta emot dig med händerna. Använd händerna för att komma upp igen.',
 'Lårcurl med handduk på golvet':'Ligg på rygg med hälarna på en handduk på ett halt golv. Lyft höften och dra hälarna mot rumpan, och glid sedan ut igen med höften uppe.',
 'Hip thrust med skivstång':'Luta övre delen av ryggen mot en bänk med stången över höften. Ha gärna en dyna under. Tryck ifrån med hälarna tills kroppen är rak från knän till axlar och kläm rumpan högst upp.',
 'Hip thrust med hantel':'Luta övre delen av ryggen mot en bänk och håll en hantel på höften. Tryck upp höften tills kroppen är rak och kläm rumpan högst upp.',
 'Enbens höftlyft':'Ligg på rygg med ena foten i golvet och det andra benet uppdraget. Tryck upp höften med det stående benet och håll bäckenet rakt.',
 'Abduktormaskin':'Sitt med dynorna på utsidan av knäna. Pressa isär benen så långt det går och för tillbaka långsamt.',
 'Sidliggande benlyft':'Ligg på sidan med benen raka. Lyft det övre benet snett bakåt-uppåt med tårna lätt nedåt och sänk långsamt.',
 'Kickback i kabel':'Fäst manschetten runt vristen och håll i maskinen. Sparka benet rakt bakåt med en spänd rumpa, utan att svanka, och för tillbaka långsamt.',
 'Adduktormaskin':'Sitt med dynorna på insidan av knäna. Pressa ihop benen och släpp tillbaka långsamt.',
 'Copenhagen-planka':'Ligg på sidan med det övre benets fot eller knä på en bänk. Lyft höften så att kroppen blir rak och håll kvar. Det känns på insidan av låret.',
 'Stående tåhävningar':'Stå med framfötterna på en kant. Sänk hälarna långt ner och res dig upp på tå så högt du kan. Håll en sekund i toppen.',
 'Sittande tåhävningar':'Sitt med framfötterna på en kant och vikten på knäna. Sänk hälarna långt ner och pressa upp på tå.',
 'Enbens tåhävning med hantel':'Stå på ett ben på en kant med hanteln i samma hand. Håll i något med andra handen. Sänk hälen långt ner och res dig upp på tå.',
 'Tåpress i benpress':'Sätt framfötterna på nederkanten av plattan med raka ben. Pressa plattan med tårna och sänk långsamt.',
 /* Bröst */
 'Bänkpress':'Ligg med skulderbladen ihop och fötterna i golvet. Greppa lite bredare än axlarna. Sänk stången till nedre delen av bröstet och pressa upp.',
 'Lutande bänkpress':'Ligg på en bänk med 30–45 graders lutning. Sänk stången till övre delen av bröstet och pressa rakt upp.',
 'Hantelpress på bänk':'Ligg på en bänk med en hantel i varje hand vid bröstet. Pressa upp tills armarna är raka och sänk kontrollerat.',
 'Lutande hantelpress':'Ligg på en lutande bänk med hantlarna vid bröstet. Pressa upp och lätt inåt, och sänk kontrollerat.',
 'Golvpress med hantlar':'Ligg på golvet med böjda knän. Sänk hantlarna tills överarmarna nuddar golvet och pressa upp.',
 'Armhävningar':'Sätt händerna lite bredare än axlarna och håll kroppen rak från huvud till häl. Sänk bröstet mot golvet och tryck upp.',
 'Armhävningar med fötterna upphöjda':'Lägg fötterna på en bänk och gör armhävningar. Håll magen spänd så att höften inte hänger.',
 'Armhävningar mot bänk':'Sätt händerna på en bänk eller bordskant och gå bak med fötterna. Sänk bröstet mot kanten med rak kropp och tryck ifrån.',
 'Dips':'Håll dig uppe i parallella stänger med raka armar. Luta dig lätt framåt och sänk tills överarmarna är parallella med golvet. Tryck upp igen.',
 'Bröstpress i maskin':'Ställ in sitsen så att handtagen är i brösthöjd. Pressa framåt tills armarna är nästan raka och för tillbaka kontrollerat.',
 'Flyes med hantlar':'Ligg på en bänk med hantlarna ovanför bröstet och lätt böjda armbågar. Öppna armarna i en båge ut åt sidorna tills det sträcker i bröstet, och för ihop dem igen.',
 'Kabelflyes':'Stå mellan kablarna med ett steg framåt. För ihop händerna framför bröstet i en båge och öppna kontrollerat igen.',
 'Pec deck':'Sitt med armarna mot dynorna eller handtagen i axelhöjd. För ihop armarna framför bröstet och öppna långsamt igen.',
 'Pullover med hantel':'Ligg tvärs över eller längs en bänk och håll en hantel med båda händerna ovanför bröstet. Sänk den i en båge bakom huvudet med lätt böjda armar och dra tillbaka.',
 /* Rygg */
 'Chins':'Häng med underhandsgrepp, axelbrett. Dra dig upp tills hakan är över stången och sänk ända ner.',
 'Pull-ups':'Häng med överhandsgrepp, lite bredare än axlarna. Dra armbågarna ner mot sidorna tills hakan är över stången, och sänk ända ner.',

function howTo(name){
  const n=String(name||'').trim(); if(!n)return '';
  if(HOWTO[n])return HOWTO[n];
  const lo=n.toLowerCase(); const hit=Object.keys(HOWTO).find(k=>k.toLowerCase()===lo); if(hit)return HOWTO[hit];
  const k=animKeyRaw(n); return k&&HOWTO_BY_ANIM[k]||'';
}

function animSVG(key,size){

}
const G=h=>`<g transform="translate(0,20)">${h}</g>`;

function adaptSteps(){

  const mon=monday(new Date());let hits=0;for(let i=1;i<=7;i++){const d=S.days[dkey(addDays(mon,-i))];if(d&&d.steps>=st.stepGoal)hits++}
  st.stepCheckWeek=wk;
  if(hits>=5){st.stepGoal=Math.min(10000,st.stepGoal+1000);toast(`Nytt stegmål: ${st.stepGoal.toLocaleString('sv-SE')} – du klarade förra veckans!`)}

function aheadInfo(off){
  const dates=[...Array(off+1)].map((_,i)=>addDays(new Date(),i));
  const types=dates.map((d,i)=>i===0&&(day().did==='skip'||seqInit().res===today())?'done':plannedFor(d));
  const typ=types[off]; const before=types.slice(0,off).filter(t=>t===typ).length;
  const info={typ,date:dates[off]};
  if(typ==='s'){const st=S.settings;
    if((st.mode==='program')&&DP_SEQ.length){const i=DP_SEQ.findIndex(w=>w.i===st.lastProg);info.w=DP_SEQ[(i+1+before)%DP_SEQ.length]}
    else if(st.mode==='gen'||!WORKOUTS.length){const p=kneeSwap(splitPlan());info.focus=p[((st.splitIdx||0)+before)%p.length];info.w=before===0?genCurrent():genPeek((st.splitIdx||0)+before,info.focus)}
    else if(before===0)info.w=suggestion();
  } else if(typ==='r'){const runToday=logsOn(today()).some(l=>l.type==='löpning');const list=rankRuns(runToday||before>0);info.r=before===0?list[0]:null}
  else if(typ==='m'){const mo=MOBILITY;info.m=mo[(info.date.getDate())%mo.length]}
  return info;
}

const avoidList=()=>S.settings.avoid||[];
const isAvoided=n=>{const a=avoidList();if(!a.length)return false;const l=String(n).toLowerCase();return a.some(x=>x.toLowerCase()===l)};
const avoidGroups=()=>S.settings.avoidGroups||[];
const groupAvoided=n=>{const g=avoidGroups();if(!g.length)return false;const m=muscleOf(n);return !!m&&g.includes(m)};
const strHash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
function subFor(name,used){
  const key=animKeyRaw(name),grp=muscleOf(name);
  const base=EXDB.filter(e=>e.n!==name&&!isAvoided(e.n)&&!avoidGroups().includes(MUSCLE_GROUP[e.m])&&!used.has(e.n)&&equipOk(e));
  let c=base.filter(e=>key&&animKeyRaw(e.n)===key&&(!grp||MUSCLE_GROUP[e.m]===grp));
  if(!c.length&&grp)c=base.filter(e=>MUSCLE_GROUP[e.m]===grp&&(key?ANIM_GROUP[animKeyRaw(e.n)]===ANIM_GROUP[key]:true));
  if(!c.length&&grp)c=base.filter(e=>MUSCLE_GROUP[e.m]===grp);
  return c.length?c[strHash(name)%c.length].n:null;
}
function AW(w,opt){
  const drop=!opt||opt.drop!==false;
  if(!w||(!avoidList().length&&!(drop&&avoidGroups().length)))return w;
  const used=new Set(w.x.flatMap(e=>String(e[0]).split(' / ')));let changed=false;
  let x=w.x;
  if(drop&&avoidGroups().length){x=x.map(e=>{const parts=String(e[0]).split(' / ');const keep=parts.filter(p=>!groupAvoided(p));if(keep.length===parts.length)return e;changed=true;if(!keep.length)return null;const n=[...e];n[0]=keep.join(' / ');if(e[3]==='superset')n[3]='straight';return n}).filter(Boolean)}
  x=x.map(e=>{const parts=String(e[0]).split(' / ');const orig=[];
    const np=parts.map(p=>{if(!isAvoided(p))return p;const s2=subFor(p,used);if(!s2)return p;used.add(s2);orig.push(p);return s2});
    if(!orig.length)return e;changed=true;const n=[...e];n[0]=np.join(' / ');n[1]=[e[1],'ersätter '+orig.join(' och ')].filter(Boolean).join(' · ');n[10]={orig};return n});
  return changed?{...w,x}:w;
}

const MUSCLE_SV={CHEST:'bröst',BICEPS:'biceps',TRICEPS:'triceps',SHOULDERS:'axlar',SHOULDER:'axlar','REAR DELTS':'baksida axlar',TRAPS:'trapezius',LATS:'lats',BACK:'rygg',NECK:'nacke',
  FOREARMS:'underarmar',FOREARM:'underarmar',ABS:'mage',CALVES:'vader',QUADS:'framsida lår',QUAD:'framsida lår',HAMSTRINGS:'baksida lår',HAMSTRING:'baksida lår',GLUTES:'rumpa',
  ADDUCTORS:'insida lår',ADDUCTOR:'insida lår',ABDUCTORS:'utsida höft',ABDUCTOR:'utsida höft',LEGS:'ben',ARMS:'armar','UPPER BODY':'överkropp','LOWER BODY':'underkropp'};
const cap1=s=>s?s[0].toUpperCase()+s.slice(1):s;
function svTitle(t){
  if(!t)return t;let suf='',base=String(t);const m=base.match(/^(.*?)(\s*\(lättare\))$/);if(m){base=m[1];suf=m[2]}
  let u=base.toUpperCase().replace(/[()]/g,' ').replace(/\s+/g,' ').trim(),pre='';
  const pm=u.match(/^(PUSH|PULL|LEGS)\s*-\s*(.*)$/);if(pm){pre={PUSH:'Press',PULL:'Drag',LEGS:'Ben'}[pm[1]];u=pm[2]}
  const out=[];
  for(const c of u.split(/\s*(?:\/|,|&|\bAND\b)\s*/).filter(Boolean)){const w=c.split(' ');let i=0;
    while(i<w.length){let light=false;if(w[i]==='LIGHT'){light=true;i++}const two=(w[i]||'')+' '+(w[i+1]||'');let sv;
      if(MUSCLE_SV[two]){sv=MUSCLE_SV[two];i+=2}else if(MUSCLE_SV[w[i]]){sv=MUSCLE_SV[w[i]];i++}else return t;
      sv=light?(/^(axlar|vader|underarmar|armar|lats)$/.test(sv)?'lätta ':'lätt ')+sv:sv;if(!out.includes(sv))out.push(sv)}}
  if(!out.length)return t;
  const j=out.length===1?out[0]:out.slice(0,-1).join(', ')+' & '+out[out.length-1];
  return (pre?pre+': '+j:cap1(j))+suf;
}

function stepsCard(){
  const days=[...Array(14)].map((_,i)=>addDays(new Date(),i-13)),goal=S.settings.stepGoal;

  const hit=vals.filter(v=>v>=goal).length,best=Math.max(...vals),bi=vals.indexOf(best),tot=vals.reduce((a,b)=>a+b,0);
  return `<section class="card stack"><div class="row between"><h3>Steg, 14 dagar</h3><span class="small muted">Mål ${fmtNum(goal)}</span></div>

   <div style="position:relative"><div class="bars">${bars}</div><div style="position:absolute;left:0;right:0;bottom:${goal/max*100}%;border-top:1px dashed var(--muted)" aria-hidden="true"></div></div>

   <div class="small muted" id="stTip">${best?`Bästa dagen: ${esc(days[bi].toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'short'}))} med ${fmtNum(best)} steg.`:'Fyll i steg på Idag så syns de här.'}</div></section>`;
}
function kmBars(weeks){const W=320,H=110,L=28,R=6,T=8,B=20,n=weeks.length,bw=(W-L-R)/n,gap=Math.min(8,bw*0.3),max=Math.max(5,...weeks.map(w=>w.km)),top=Math.ceil(max/5)*5,yi=v=>T+(H-T-B)*(1-v/top);
  let g='';[0,top/2,top].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${yi(v)}" y2="${yi(v)}" stroke="var(--line)"/><text x="${L-4}" y="${yi(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${fmtNum(v)}</text>`);
  const b=weeks.map((w,i)=>{const x=L+i*bw+gap/2,bwi=bw-gap,h=yi(0)-yi(w.km),r=Math.min(4,h,bwi/2),y0=yi(w.km);const tip=`Vecka ${w.nr}: ${fmtNum(w.km,1)} km`;
    return (w.km?`<path d="M${x} ${yi(0)} V${y0+r} Q${x} ${y0} ${x+r} ${y0} H${x+bwi-r} Q${x+bwi} ${y0} ${x+bwi} ${y0+r} V${yi(0)} Z" fill="var(--c-r)"/>`:'')+(i===n-1&&w.km?`<text x="${x+bwi/2}" y="${y0-3}" text-anchor="middle" font-size="9" fill="var(--ink)">${fmtNum(w.km,1)}</text>`:'')+
     `<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-tip="${esc(tip)}" data-tipfor="kmTip" style="cursor:pointer"><title>${esc(tip)}</title></rect>`+((i%2===(n-1)%2)?`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">v${w.nr}</text>`:'')}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kilometer per vecka">${g}${b}</svg><div class="small muted" id="kmTip">Totalt ${fmtNum(weeks.reduce((a,w)=>a+w.km,0),1)} km på 12 veckor.</div>`}
function runSpeedBlock(){const R=S.log.filter(l=>l.type==='löpning'&&(+l.avg||+l.hard));if(!R.length)return '';
  const T={'Intervaller':'var(--c-r)','Progressivt':'var(--c-s)','Lätt pass':'var(--c-m)','Backe':'var(--warn)','Gång/jogg':'var(--muted)'};
  const typeOf=l=>l.pass_type||(()=>{const r=RUNS.find(x=>x.id===l.rid);return r?passTypeLabel(r):'Intervaller'})();
  const val=l=>typeOf(l)==='Intervaller'?(+l.hard||+l.avg):(+l.avg||+l.hard);
  const series=Object.keys(T).map(k=>({k,c:T[k],pts:R.filter(l=>typeOf(l)===k&&val(l)).map(l=>({d:l.date,y:val(l)}))})).filter(x=>x.pts.length);
  const wins=[];const byId={};R.forEach(l=>{(byId[l.rid]=byId[l.rid]||[]).push(l)});
  Object.values(byId).forEach(a=>{if(a.length<2)return;const last=a[a.length-1];const earlier=a.slice(0,-1).reverse().find(p=>+p.rpe&&+last.rpe&&val(last)>=val(p)-0.05&&+last.rpe<+p.rpe);
    if(earlier)wins.push(`${last.title}: ${fmtK(val(last))} km/h på ${last.rpe}/10 – förra gången ${fmtK(val(earlier))} km/h på ${earlier.rpe}/10.`)});
  return `<h4>Fart per passtyp</h4>${series.length>1?`<div class="legend small">${series.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.k)}</span>`).join('')}</div>`:''}${lineChart(series,'km/h')}
   <p class="small muted" style="margin:0">Intervaller visar farten i de hårda delarna, övriga pass snittfarten.</p>
   ${wins.length?`<div class="note"><strong>Samma fart, lägre ansträngning:</strong><br>${wins.slice(0,3).map(esc).join('<br>')}</div>`:''}`}
function weightBlock(h){const names=Object.keys(h).sort((a,b)=>h[b].length-h[a].length||a.localeCompare(b));if(!names.length)return '';
  if(!h[progEx])progEx=names[0];const pts=h[progEx].map(p=>({d:p.d,y:p.kg})),first=pts[0].y,best=Math.max(...pts.map(p=>p.y));
  return `<h4>Viktutveckling</h4><label class="f" for="progEx">Övning<select id="progEx">${names.map(n=>`<option ${n===progEx?'selected':''} value="${esc(n)}">${esc(n)} (${h[n].length})</option>`).join('')}</select></label>
   ${lineChart([{pts,c:'var(--c-s)',area:1}],'kg')}<p class="small muted" style="margin:0">Tyngsta set per pass. ${pts.length>1&&best>first?`Från ${fmtNum(first,1)} till ${fmtNum(best,1)} kg – <strong>+${fmtNum((best-first)/first*100)} %</strong>.`:'Övningarna du gjort flest gånger visas först.'}</p>`}

/* ---------- Avstämning: frågor ungefär var tredje dag ----------
   Sparas i settings.checkin {every,start,last,snooze} och settings.checkins [historik].
   Appen ändrar aldrig något själv – svaren blir förslag som man godkänner. */
let ciState=null, ciQ=null;
function ciConf(){const st=S.settings;if(!st.checkin)st.checkin={every:3};return st.checkin}
function ciWindow(){const c=ciConf();const from=c.last&&daysBetween(c.last,today())<14?c.last:dkey(addDays(new Date(),-(c.every||3)));return from}
function ciStats(){
  const from=ciWindow(),tk=today(),st=S.settings;
  const L=S.log.filter(l=>l.date>from&&l.date<=tk);const days=Math.max(1,daysBetween(from,tk));
  const pass=L.filter(l=>l.type==='styrka'||l.type==='löpning').length;
  const exp=Math.round(((+st.strength||0)+(+st.cardio||0))/7*days);
  const steps=[...Array(days)].map((_,i)=>+(S.days[dkey(addDays(new Date(),-i))]?.steps)||0);
  const avg=Math.round(steps.reduce((a,b)=>a+b,0)/days);
  const runs=L.filter(l=>l.type==='löpning'&&+l.rpe);const rpe=runs.length?runs.reduce((a,l)=>a+ +l.rpe,0)/runs.length:0;
  const mob=L.filter(l=>l.type==='rörlighet').length+[...Array(days)].filter((_,i)=>S.days[dkey(addDays(new Date(),-i))]?.mob).length;
  return {days,pass,exp,avg,runs:runs.length,rpe,mob,missed:exp-pass>=1};
}
function ciDue(){
  const c=ciConf(),tk=today();if(!c.every)return false;
  if(!c.start){c.start=tk;markDirty('settings');return false}
  if(c.last===tk||(c.snooze&&c.snooze>tk))return false;
  if(daysBetween(c.start,tk)<3)return false;
  const base=c.last||c.start;
  const early=(needEasy().twoHard||(S.settings.painAlert&&S.settings.painAlert.date>=dkey(addDays(new Date(),-1))))&&daysBetween(base,tk)>=1;
  return early||daysBetween(base,tk)>=c.every;
}
function ciCard(){
  if(ciState==='ok'){return `<section class="card stack checkin" aria-live="polite"><span class="eyebrow">Avstämning</span><h3>Toppen – vi kör vidare som nu</h3>
    <p class="small muted" style="margin:0">Vill du fortsätta få avstämningar?</p>
    <div class="row" style="gap:6px"><button class="btn ghost sm" type="button" data-ciev="3" aria-pressed="${ciConf().every===3}">Var 3:e dag</button><button class="btn ghost sm" type="button" data-ciev="7" aria-pressed="${ciConf().every===7}">En gång i veckan</button><button class="btn ghost sm" type="button" data-ciev="0">Nej tack</button></div></section>`}
  if(!ciDue())return '';
  const s=ciStats();
  const bits=[`${s.pass} av ${Math.max(s.exp,s.pass)} pass`,s.avg?`snitt ${s.avg.toLocaleString('sv-SE')} steg`:'',s.runs?`löpningen ${String(Math.round(s.rpe*10)/10).replace('.',',')}/10`:''].filter(Boolean);
  return `<section class="card stack checkin"><span class="eyebrow">Avstämning</span><h3>Hur går det?</h3>
   <p class="small" style="margin:0">Senaste ${s.days} dagarna: ${esc(bits.join(' · '))}.</p>
   <div class="row" style="gap:6px"><button class="btn sm" type="button" data-ciok>Funkar bra</button><button class="btn ghost sm" type="button" data-ciopen>Svara (30 s)</button><button class="btn ghost sm" type="button" data-cilater>Senare</button></div>
   <button class="linkbtn small muted" type="button" data-cioff>Vill inte ha avstämningar</button></section>`;
}

function ciQuestions(){const s=ciStats(),st=S.settings;const q=[
  {k:'feel',t:'Hur har de senaste dagarna känts?',o:[['latt','För lätt'],['lagom','Lagom'],['tufft','För tufft']]},
  {k:'time',t:'Hinner du med?',o:[['gott','Ja, med marginal'],['precis','Precis'],['mycket','Nej, det blir för mycket']]}];

   ${i>0?`<button class="btn ghost" type="button" data-ciback>Tillbaka</button>`:''}</div>`);

/* Svar → förslag. Allt räknas som nettoförändringar så att motstridiga svar tar ut varandra. */
function ciProposals(a){
  const st=S.settings,s=ciStats();const d={str:0,car:0,maxDown:0,step:0,move:0,lvl:0,v10:0,mob:null,mix:false};
  const tight=a.time==='mycket'||a.why==='tid';
  if(tight){if(!st.maxMin||st.maxMin>45)d.maxDown=1;else if(st.strength>2)d.str--;else if(st.cardio>1)d.car--}
  if(a.feel==='tufft'||a.why==='ork'){if((st.level||2)>1)d.lvl--;else if(st.strength>=3)d.str--}
  if(a.feel==='latt'&&!tight){if((st.level||2)<3)d.lvl++;if(s.avg>=st.stepGoal)d.step+=1000}
  if(a.run==='tung')d.v10-=0.3;if(a.run==='latt')d.v10+=0.25;
  if(a.why==='lust'&&st.mode==='program'&&WORKOUTS.length)d.mix=true;
  const m=a.more||{};
  if(m.s)d.str+=m.s;if(m.r)d.car+=m.r;if(m.m)d.mob=m.m>0?'lång':'kort';if(m.v){d.step+=1000*m.v;d.move+=2*m.v}
  const P=[];const str=Math.max(1,Math.min(6,(+st.strength||0)+d.str)),car=Math.max(0,Math.min(4,(+st.cardio||0)+d.car));
  if(str!==+st.strength&&str+car<=7)P.push({id:'str',t:`${str} styrkepass i veckan i stället för ${st.strength}`,f:x=>{x.strength=str;x.weekPlan=null;x.genCur=null}});
  if(car!==+st.cardio&&str+car<=7)P.push({id:'car',t:`${car} löppass i veckan i stället för ${st.cardio}`,f:x=>{x.cardio=car;x.weekPlan=null;x.genCur=null}});
  if(d.maxDown){const nx=!st.maxMin||st.maxMin>60?60:45;P.push({id:'max',t:`Kortare pass: max ${nx} minuter`,f:x=>{x.maxMin=nx;x.minutes=Math.min(x.minutes||60,nx)}})}

async function readTreadmill(files){

}

function applySetting(k,v,silent){
  const st=S.settings;
  const num=x=>{const n=parseFloat(String(x).replace(',','.'));return isNaN(n)?null:n};
  switch(k){
    case 'strength':case 'cardio':{const n=Math.max(0,Math.min(k==='strength'?6:4,+v));const other=k==='strength'?+st.cardio||0:+st.strength||0;
      if(n+other>7){toast('Högst 7 pass i veckan');return}st[k]=n;st.weekPlan=null;st.genCur=null;break}
    case 'mode':st.mode=v;st.genCur=null;if(v==='program'&&!st.lastProg&&DP_SEQ.length)st.lastProg=DP_SEQ[0].i;break;
    case 'setSplit':setSplit=+v;return showSettings();
    case 'lastProg':st.lastProg=v;setSplit=null;break;
    case 'prog':{const a=new Set(st.programs||[]);a.has(v)?a.delete(v):a.add(v);if(!a.size){toast('Välj minst ett program');return}st.programs=[...a];break}
    case 'goal':st.goal=v;st.genCur=null;st.splitIdx=0;break;
    case 'passLen':{const n=+v;if(st.mode==='gen'||!WORKOUTS.length){st.minutes=n;st.maxMin=n}else{st.maxMin=n;st.minutes=n||60}st.genCur=null;break}
    case 'level':st.level=+v;st.genCur=null;break;
    case 'equip':st.equip=v;st.genCur=null;break;
    case 'kneeFocus':st.kneeFocus=!!v;st.genCur=null;break;
    case 'runPref':case 'runLevel':case 'runStyle':st[k]=v;break;
    case 'tenK':{const raw=String(v).trim();if(!raw)break;const tk=parseTenK(raw);if(!tk){toast('Skriv tiden i minuter, t.ex. 48');return}st.tenK=raw;st.v10=Math.round(600/tk*100)/100;break}
    case 'coolKmh':{const n=num(v);if(n>0)st.coolKmh=n;break}
    case 'coolInc':{const n=num(v);if(n!=null&&n>=0)st.coolInc=n;break}
    case 'comeback':st.comebackUntil=v?(comebackOn()?st.comebackUntil:dkey(addDays(new Date(),21))):null;break;
    case 'mobPref':st.mobPref=v||'';break;
    case 'pelvic':{const a=(st.issues||[]).filter(x=>x!=='bäckenbotten');if(v)a.push('bäckenbotten');st.issues=a;break}
    case 'stepGoal':st.stepGoal=Math.max(2000,Math.min(25000,Math.round(+v/500)*500));break;
    case 'adaptSteps':st.adaptSteps=!!v;break;
    case 'moveGoal':st.moveGoal=Math.max(4,Math.min(12,+v));break;
    case 'issue':{const a=new Set(st.issues||[]);a.has(v)?a.delete(v):a.add(v);st.issues=[...a];st.cycle=a.has('mens');if(v==='knä'&&a.has('knä'))st.kneeFocus=true;st.genCur=null;break}
    case 'ciEvery':ciConf().every=+v;break;
    case 'sex':st.sex=v||'';st.genCur=null;st.splitIdx=0;break;
    default:return;
  }
  markDirty('settings');sugCache=null;sugIdx=0;setSavedAt=Date.now();
  if(silent){const s=document.getElementById('setStatus');if(s)s.textContent='Sparat ✓';const ri=document.getElementById('runInfo');if(ri&&(k==='tenK')){const V=v10();ri.innerHTML=`Appen räknar med 10 km på ca <strong>${tenKTime()}</strong>. Lätt jogg ca ${fmtK(V*0.75)} km/h · intervaller ca ${fmtK(V)} km/h. Farten justeras efter hur passen känns.`}}
  else showSettings();
  clearTimeout(applySetting._t);applySetting._t=setTimeout(()=>{const s=document.getElementById('setStatus');if(s)s.textContent='Ändringar sparas direkt'},2500);
}
const SET_STEP={stepGoal:500,moveGoal:2};
function bindSettings(root){
  root.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>applySetting(b.dataset.set,b.dataset.val));
  root.querySelectorAll('[data-setstep]').forEach(b=>b.onclick=()=>{const k=b.dataset.setstep;applySetting(k,(+S.settings[k]||0)+(+b.dataset.d)*(SET_STEP[k]||1))});
  root.querySelectorAll('[data-settog]').forEach(c=>c.onchange=()=>applySetting(c.dataset.settog,c.checked));
  root.querySelectorAll('[data-setin]').forEach(c=>c.onchange=()=>applySetting(c.dataset.setin,c.value,c.tagName==='INPUT'));
  root.querySelectorAll('details[data-sec]').forEach(d=>d.addEventListener('toggle',()=>{d.open?setOpen.add(d.dataset.sec):setOpen.delete(d.dataset.sec)}));
}

  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{if(mobState){clearInterval(mobState.t);mobState=null}closeSheet()});
  root.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{active=null;closeSheet();toast('Passet avbröts')});
  root.querySelectorAll('[data-finish]').forEach(b=>b.onclick=finishWorkout);
  root.querySelectorAll('[data-kg]').forEach(inp=>inp.oninput=()=>{const [i,j]=inp.dataset.kg.split(':');active.sets[i][j][0]=inp.value.replace(',','.').replace(/[^0-9.]/g,'')});
  root.querySelectorAll('[data-rp]').forEach(inp=>inp.oninput=()=>{const [i,j]=inp.dataset.rp.split(':');active.sets[i][j][1]=inp.value});
  root.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.ok.split(':').map(Number);const s=active.sets[i][j];s[2]=!s[2];
    if(s[2]&&!s[0]){const sg=weightSuggest(WBYID[active.wid].x[i]);const p=lastSetsFor(WBYID[active.wid].x[i][0]);if(sg&&sg.kgs[j]!=='')s[0]=String(sg.kgs[j]);else if(p&&p[j]&&p[j][0])s[0]=p[j][0];else if(j>0&&active.sets[i][j-1][0])s[0]=active.sets[i][j-1][0]}
    if(s[2]&&!s[1]){s[1]=WBYID[active.wid].x[i][9]?.[j]||''}
    b.setAttribute('aria-pressed',s[2]);b.textContent=s[2]?'✓':'';
    const row=b.parentElement;row.querySelector(`[data-kg="${i}:${j}"]`).value=String(s[0]).replace('.',',');row.querySelector(`[data-rp="${i}:${j}"]`).value=s[1];
    const all=active.sets.flat();$('#sheetBody .date').textContent=`${all.filter(x=>x[2]).length}/${all.length} set klara`;
    if(s[2])startRest(defaultRest(WBYID[active.wid].x[i]))});
  root.querySelectorAll('[data-runlog]').forEach(b=>b.onclick=()=>showRunLog(b.dataset.runlog));
  root.querySelectorAll('[data-rpe]').forEach(b=>b.onclick=()=>{runLog.rpe=+b.dataset.rpe;root.querySelectorAll('[data-rpe]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  root.querySelectorAll('[data-parea]').forEach(b=>b.onclick=()=>{runLog.area=b.dataset.parea;root.querySelectorAll('[data-parea]').forEach(x=>x.setAttribute('aria-pressed',x===b));const pb=$('#painBox');if(pb)pb.hidden=!runLog.area;if(runLog.area)runLog.pain=+($('#painS')||{}).value||2});
  const ps=root.querySelector('#painS');if(ps)ps.oninput=()=>{runLog.pain=+ps.value;$('#painV').textContent=ps.value};
  const tp=root.querySelector('#tmPhoto');if(tp)tp.onchange=()=>{if(tp.files&&tp.files.length)readTreadmill(tp.files);tp.value=''};
  root.querySelectorAll('[data-editrun]').forEach(b=>b.onclick=()=>showRunEdit(b.dataset.editrun));
  root.querySelectorAll('[data-saveedit]').forEach(b=>b.onclick=()=>{const l=S.log.find(x=>x.ts===+b.dataset.saveedit);if(!l)return;const num=id=>parseFloat(String($(id).value).replace(',','.'))||0;
    const min=num('#runMin'),km=num('#runKm');let avg=num('#runAvg');if(!avg&&km&&min)avg=km/(min/60);
    if(min){l.min=min;if(l.rpe)l.load=Math.round(min*l.rpe)}l.km=km||l.km||0;l.avg=avg?Math.round(avg*10)/10:(l.avg||0);l.note=$('#runNote').value.trim();
    markDirty('log',monthOf(l.date));closeSheet();toast('Passet är uppdaterat')});
  root.querySelectorAll('[data-saverun]').forEach(b=>b.onclick=()=>saveRun(RUNS.find(x=>x.id===b.dataset.saverun)));
  root.querySelectorAll('[data-runstart]').forEach(b=>b.onclick=()=>startRun(b.dataset.runstart));
  root.querySelectorAll('[data-runplay]').forEach(b=>b.onclick=()=>{const s=runState;s.run=!s.run;clearInterval(s.t);if(s.run){if(!s.start)s.start=Date.now();s.t=setInterval(runTick,1000)}b.textContent=s.run?'Pausa':'Starta'});
  root.querySelectorAll('[data-runskip]').forEach(b=>b.onclick=()=>{const s=runState;if(s.left>10&&s.r.seg[s.i+1]&&s.start){s.ask=true;renderRun();if(s.run){const pb=document.querySelector('[data-runplay]');if(pb)pb.textContent='Pausa'}return}clearInterval(s.t);const was=s.run;runNext(0);if(runState&&was){runState.t=setInterval(runTick,1000)}});
  root.querySelectorAll('[data-skipmode]').forEach(b=>b.onclick=()=>{const s=runState;clearInterval(s.t);const was=s.run;const carry=b.dataset.skipmode==='carry'?Math.max(0,s.left):0;s.left=0;runNext(carry);if(runState&&was){runState.t=setInterval(runTick,1000)}if(carry)toast(`${mmss(carry)} läggs på nästa del`)});
  root.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>{const s=runState;s.adj=Math.round((s.adj+ +b.dataset.adj)*10)/10;const was=s.run;renderRun();if(was){const pb=document.querySelector('[data-runplay]');if(pb)pb.textContent='Pausa'}});
  root.querySelectorAll('[data-runclose]').forEach(b=>b.onclick=()=>{const s=runState;clearInterval(s.t);if(!s.start){runState=null;closeSheet();return}recordSeg();const rid=s.r.id,act=s.actual;runState=null;showRunLog(rid,null,act)});
  root.querySelectorAll('[data-mob]').forEach(b=>b.onclick=()=>showMobility(b.dataset.mob));
  root.querySelectorAll('[data-mobplay]').forEach(b=>b.onclick=()=>{const s=mobState;s.run=!s.run;clearInterval(s.t);if(s.run)s.t=setInterval(mobTick,1000);b.textContent=s.run?'Pausa':'Starta'});
  root.querySelectorAll('[data-mobgo]').forEach(b=>b.onclick=()=>{const s=mobState;if(!s)return;const j=+b.dataset.mobgo;clearInterval(s.t);s.run=false;s.i=j;s.left=s.m.items[j][1];renderMob();try{document.querySelector('.sheet')&&(document.querySelector('.sheet').scrollTop=0)}catch(e){}});
  root.querySelectorAll('[data-mobskip]').forEach(b=>b.onclick=()=>{const run=mobState.run;clearInterval(mobState.t);mobNext();if(mobState&&run){mobState.run=true;mobState.t=setInterval(mobTick,1000);const pb=document.querySelector('[data-mobplay]');if(pb)pb.textContent='Pausa'}});
  root.querySelectorAll('[data-settings]').forEach(b=>b.onclick=showSettings);
  const ss=root.querySelector('#sSplit'); if(ss) ss.onchange=()=>{$('#sLast').innerHTML=progOptions(+ss.value,'')};
  root.querySelectorAll('[data-savesettings]').forEach(b=>b.onclick=()=>{const st=S.settings;if(+$('#sStr').value!==st.strength||+$('#sCar').value!==st.cardio){st.weekPlan=null;st.genCur=null}st.strength=+$('#sStr').value;st.cardio=+$('#sCar').value;if($('#sCi'))ciConf().every=+$('#sCi').value;st.stepGoal=Math.max(1000,+$('#sSteps').value||10000);st.maxMin=+$('#sMax').value;st.runPref=$('#sRun').value;{const raw=$('#sTenK').value.trim();const tk=parseTenK(raw);if(tk&&raw!==String(st.tenK||'')){st.tenK=raw;st.v10=Math.round(600/tk*100)/100}
      const ck=parseFloat(String($('#sCoolK').value).replace(',','.'));if(ck>0)st.coolKmh=ck;const ci=parseFloat(String($('#sCoolI').value).replace(',','.'));if(ci>=0)st.coolInc=ci;
      const cb=$('#sComeback').checked;if(cb&&!comebackOn())st.comebackUntil=dkey(addDays(new Date(),21));if(!cb)st.comebackUntil=null;}if($('#sMode')){st.mode=$('#sMode').value;st.lastProg=$('#sLast').value||st.lastProg};st.moveGoal=+$('#sMoves').value||8;
    if(DP_SEQ.length){st.programs=[...document.querySelectorAll('[data-prog]')].filter(c=>c.checked).map(c=>c.dataset.prog);if(!st.programs.length)st.programs=Object.keys(PROG);}
    markDirty('settings');sugCache=null;sugIdx=0;closeSheet();toast('Inställningar sparade')});
  root.querySelectorAll('[data-libfile]').forEach(inp=>inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
    let j;try{j=JSON.parse(await f.text())}catch(e){toast('Filen gick inte att läsa');return}const lib=j.lib||j;
    if(!lib||!Array.isArray(lib.workouts)||!lib.workouts.length){toast('Det där ser inte ut som en programfil');return}
    toast('Läser in programmet …');
    try{await sbFetch('/rest/v1/user_docs',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{user_id:SBUSER.id,doc:'library',body:{lib},updated_at:new Date().toISOString()}])})}catch(e){toast('Kunde inte spara: '+e.message);return}
    setLibrary(lib);try{localStorage.setItem(LIBK,JSON.stringify({uid:SBUSER.id,lib}))}catch(e){}
    const st=S.settings;st.programs=lib.programs.map(p=>p.k);if(DP_SEQ.length){st.mode='program';if(j.lastProg&&WBYID[j.lastProg])st.lastProg=j.lastProg;else if(!WBYID[st.lastProg])st.lastProg=DP_SEQ[0].i;st.progKey='DP'}else st.mode='mix';
    st.genCur=null;markDirty('settings');showSettings();toast(`Klart – ${WORKOUTS.length} pass inlästa. Nästa pass: ${DP_SEQ.length?wTitle(programNext()):''}`)});
  root.querySelectorAll('[data-libremove]').forEach(b=>b.onclick=async()=>{try{await sbFetch('/rest/v1/user_docs?doc=eq.library',{method:'DELETE'})}catch(e){toast('Kunde inte ta bort: '+e.message);return}
    try{localStorage.removeItem(LIBK)}catch(e){}S.settings.mode='gen';S.settings.genCur=null;markDirty('settings');lsSave();toast('Programmet är borttaget');setTimeout(()=>location.reload(),800)});
  root.querySelectorAll('[data-export]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));S.settings.lastBackup=Date.now();markDirty('settings');toast('Kopierat')}catch(e){toast('Kunde inte kopiera')}});
  root.querySelectorAll('[data-backup]').forEach(b=>b.onclick=doBackup);
  root.querySelectorAll('[data-backuplater]').forEach(b=>b.onclick=()=>{S.settings.lastBackup=Date.now();markDirty('settings');render()});
  root.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>{try{const v=JSON.parse($('#imp').value);if(!v.log||!v.days)throw 0;S={settings:{...DEFAULT_SETTINGS,...v.settings},days:v.days,log:v.log};
    dirty.add('settings');new Set(Object.keys(S.days).map(monthOf)).forEach(m=>dirty.add('days-'+m));new Set(S.log.map(l=>monthOf(l.date))).forEach(m=>dirty.add('log-'+m));lsSave();flush();closeSheet();toast('Data inläst')}catch(e){toast('Det där ser inte ut som en säkerhetskopia')}});
  const q=root.querySelector('#libQ'); if(q){q.oninput=()=>{libQ=q.value;libShow=40;const pos=q.selectionStart;render();const n=$('#libQ');n.focus();n.setSelectionRange(pos,pos)}}
  root.querySelectorAll('[data-lprog]').forEach(b=>b.onclick=()=>{libProg=b.dataset.lprog;libShow=40;render()});
  root.querySelectorAll('[data-lgroup]').forEach(b=>b.onclick=()=>{libGroup=b.dataset.lgroup;libShow=40;render()});
  root.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{libShow+=40;render()});
}
if(BUILD==='public'&&'serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
function regLogs(){S.log.forEach(l=>{if(l.wobj)regW(l.wobj)});if(S.settings.genCur)regW(S.settings.genCur)}
regLogs();
render();
startAnims();
let booted=false;
function boot(){if(booted)return;booted=true;regLogs();seedRun();
  if(BUILD==='public'&&SB&&!SBUSER&&!S.settings.skipLogin){showLogin();return}
  if(!S.settings.onb){ if(BUILD==='owner'){S.settings.onb={preset:true};markDirty('settings');render()} else showOnboarding() } }
initCloud().finally(()=>{regLogs();boot()});
setTimeout(boot,3500);
setInterval(()=>{if(tab==='idag'&&!$('#sheet').classList.contains('open')&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tab==='idag'&&!$('#sheet').classList.contains('open'))render()});
</script>
